</head>
<body>

<nav class="navbar navbar-expand-lg site-nav">
  <div class="container-xl px-lg-5">
    <a class="navbar-brand" href="index.html">Angelina Lang <span class="brand-star">&#10035;</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
        <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
        <li class="nav-item"><a class="nav-link active" href="projects.html">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
      <div class="d-flex gap-2 mt-3 mt-lg-0">
        <button id="themeToggle" class="btn-icon" type="button" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
        <a class="btn-icon" href="https://www.linkedin.com/in/your-linkedin-handle" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
      </div>
    </div>
  </div>
</nav>

<main>
  <header class="page-header">
    <div class="container-xl px-lg-5">
      <p class="eyebrow">Selected work</p>
      <h1>Projects</h1>
      <p>Coursework, team builds, and ventures. Filter by category, or select a card for more detail.</p>
    </div>
  </header>

  <section class="block pt-0">
    <div class="container-xl px-lg-5">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div id="filterBar" class="filter-bar" role="group" aria-label="Filter projects by category"></div>
        <span id="projectCount" class="text-muted small"></span>
      </div>
      <div class="row g-4" id="projectGrid"></div>
    </div>
  </section>
</main>

<!-- Project details modal -->
<div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <span class="badge badge-cat mb-2" id="modalCategory"></span>
          <h2 class="modal-title" id="modalTitle"></h2>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="modalDescription"></p>
        <p class="text-muted" id="modalDetails"></p>
        <div id="modalTech"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-forest" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container-xl px-lg-5 d-flex flex-wrap justify-content-between">
    <span>&copy; <span id="year">2026</span> Angelina Lang</span>
    <span>University of Oklahoma &middot; Price College of Business</span>
  </div>
</footer>
